[project]
name = "botlite"
version = "1.2.0"
description = "Self-hosted Telegram bot downloader"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "telethon>=1.45.0",
    "yt-dlp>=2026.8.19",
    "gallery-dl>=1.32.15",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.14.4",
    "py-tgcalls>=3.0.0",
    "ntgcalls>=3.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.run]
source = ["botlite"]
omit = [
    "botlite/__main__.py",
]
