[project]
name = "botlite"
version = "1.2.0"
description = "Self-hosted Telegram bot downloader"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "telethon>=1.46.0",
    "yt-dlp>=2026.11.23",
    "gallery-dl>=1.32.21",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.14.5",
    "py-tgcalls>=3.0.1",
    "ntgcalls>=3.0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.run]
source = ["botlite"]
