apiVersion: v1
kind: Secret
metadata:
  name: bot-lite-downloader-secrets
  namespace: bot-lite-downloader
type: Opaque
stringData:
  # Telegram API credentials — https://my.telegram.org
  API_ID: "0"
  API_HASH: "REPLACE_ME"
  # Bot token from @BotFather
  BOT_TOKEN: "REPLACE_ME"
  # Comma-separated Telegram user IDs with admin rights
  SUDO_USERS: "REPLACE_ME"