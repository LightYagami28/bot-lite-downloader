apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bot-lite-downloader
  namespace: bot-lite-downloader
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bot-lite.example.com
      secretName: bot-lite-downloader-tls
  rules:
    - host: bot-lite.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bot-lite-downloader
                port:
                  name: webapp