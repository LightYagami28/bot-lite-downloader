apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-lite-downloader
  namespace: bot-lite-downloader
  labels:
    app.kubernetes.io/name: bot-lite-downloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-lite-downloader
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-lite-downloader
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: bot
          image: bot-lite-downloader:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: webapp
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bot-lite-downloader-config
            - secretRef:
                name: bot-lite-downloader-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/status
              port: webapp
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: webapp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/status
              port: webapp
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bot-lite-downloader-data