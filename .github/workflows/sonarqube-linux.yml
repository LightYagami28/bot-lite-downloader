name: SonarQube Linux
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: sonarqube-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sonarqube:
    name: Test, copertura e analisi (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Il secret SONAR_TOKEN sta nell'environment Sonarcloud.
    environment: Sonarcloud
    permissions:
      contents: read
      pull-requests: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: --no-binary pyaes -r requirements-dev.lock
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # Dependabot updates requirements*.txt and pyproject.toml; the hash locks must follow.
      - name: Hash locks and uv.lock are in sync
        run: |
          for name in requirements requirements-dev; do
            cp "$name.lock" "/tmp/$name.lock"
            uv pip compile "$name.txt" --universal --python-version 3.14 --generate-hashes --no-header -o "/tmp/$name.lock"
            diff -u "$name.lock" "/tmp/$name.lock" || { echo "Regenerate $name.lock with uv pip compile"; exit 1; }
          done
          uv lock --check
      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -W error::DeprecationWarning --cov=botlite --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
      - name: Run Bandit security rules
        run: ruff check botlite --select S
      - name: Audit runtime and development dependencies
        run: pip-audit -r requirements-dev.lock
      - name: Build runtime container image
        run: docker build --tag botlite-downloader:ci .
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-linux
          path: coverage.xml
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      # Senza SONAR_TOKEN (fork, Dependabot) la scansione si salta.
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304  # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
