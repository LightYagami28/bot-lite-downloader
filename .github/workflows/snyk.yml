name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC

# Skip the whole workflow when SNYK_TOKEN is not configured (e.g. forks).
# Remove this block once the secret is added in repo Settings → Secrets.
env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:
  # ── Python dependency scan ──────────────────────────────────────────────────
  snyk-python:
    name: Snyk — Python deps
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk test (pip)
        run: snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high
        continue-on-error: false   # fail the check on high/critical findings

  # ── Docker image scan ───────────────────────────────────────────────────────
  snyk-docker:
    name: Snyk — Docker image
    runs-on: ubuntu-latest
    if: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t botlite-downloader:ci .

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk container test
        run: |
          snyk container test botlite-downloader:ci \
            --file=Dockerfile \
            --severity-threshold=high \
            --exclude-base-image-vulns
        continue-on-error: false
