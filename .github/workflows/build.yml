name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Opt into Node.js 24 for JavaScript actions to avoid Node.js 20 deprecation warnings
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Add repository root to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Run tests with coverage
        run: pytest --cov=botlite --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Check coverage artifact and SONAR_TOKEN
        run: |
          echo "Files in workspace:" && ls -la
          if [ -f coverage.xml ]; then echo "coverage.xml found" && head -n 5 coverage.xml; else echo "coverage.xml NOT found"; fi
          if [ -z "${SONAR_TOKEN}" ]; then echo "SONAR_TOKEN is not set"; else echo "SONAR_TOKEN is set"; fi
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
