name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
env:
  # Opt into Node.js 24 for JavaScript actions to avoid deprecation warnings.
  # Set at workflow level so it's available before any actions execute.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Add repository root to PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Run tests with coverage
        run: pytest -W error::DeprecationWarning --cov=botlite --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
      - name: Run Bandit security rules
        run: ruff check botlite --select S
      - name: Audit runtime and development dependencies
        run: pip-audit -r requirements-dev.txt
      - name: Build runtime container image
        run: docker build --tag botlite-downloader:ci .
      - name: Check coverage artifact and SONAR_TOKEN
        run: |
          echo "Files in workspace:" && ls -la
          if [ -f coverage.xml ]; then echo "coverage.xml found" && head -n 5 coverage.xml; else echo "coverage.xml NOT found"; fi
          if [ -z "${SONAR_TOKEN}" ]; then echo "SONAR_TOKEN is not set"; else echo "SONAR_TOKEN is set"; fi
      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
