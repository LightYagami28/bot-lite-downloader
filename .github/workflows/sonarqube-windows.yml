name: SonarQube Windows
# Stessi test e stessa copertura del job Linux. La pubblicazione su SonarCloud resta nel job Linux:
# tre analisi dello stesso ramo si sovrascriverebbero.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: sonarqube-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Test e copertura (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: --no-binary pyaes -r requirements-dev.lock
      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -W error::DeprecationWarning --cov=botlite --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Run Ruff
        run: ruff check .
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-windows
          path: coverage.xml
